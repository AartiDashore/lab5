<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2 Document Retrieval System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-container">
    <!-- LEFT PANEL -->
    <div class="panel history-panel">
        <div class="panel-header">
            <h2>History</h2>
            <button id="clearHistoryButton" onclick="clearHistory()">Clear History</button>
        </div>
        <div id="historyList" class="history-list">
            <div class="empty-state">No searches yet</div>
        </div>
    </div>

    <!-- CENTER PANEL -->
    <div class="panel search-panel">
        <h1>Lab 5: Document Retrieval</h1>

        <div class="health-section">
            <button id="healthButton" onclick="displayHealth()">Check Health</button>
            <div id="health-status">Click to check server status</div>
        </div>

        <!-- System Prompt -->
        <div class="system-prompt-section">
            <div class="system-prompt-header">
                <label for="systemPrompt"><strong>System Prompt</strong></label>
                <div class="system-prompt-buttons">
                    <button onclick="saveSystemPrompt()">Save</button>
                    <button onclick="resetSystemPrompt()">Reset</button>
                </div>
            </div>
            <textarea id="systemPrompt" rows="5"></textarea>
        </div>

        <!-- Search -->
        <div class="search-section">
            <textarea
                id="queryInput"
                placeholder="Enter your search query..."
                rows="3"
            ></textarea>

            <div class="search-controls">
                <label><input type="checkbox" id="useHybrid" checked> Hybrid</label>
                <label><input type="checkbox" id="useReranking" checked> Reranking</label>
                <label>Results:
                    <input type="number" id="numResults" value="5" min="1" max="20">
                </label>
            </div>

            <div style="display:flex; gap:8px;">
                <button id="searchButton" onclick="performSearch()">Search</button>
                <button id="previewPromptButton" onclick="showPromptPreview()">Preview Prompt</button>
            </div>
        </div>

        <!-- Metrics -->
        <div class="metrics-section">
            <div class="metric">
                <span class="metric-label">Method</span>
                <span id="methodValue" class="metric-value">—</span>
            </div>
            <div class="metric">
                <span class="metric-label">Results</span>
                <span id="countValue" class="metric-value">—</span>
            </div>
            <div class="metric">
                <span class="metric-label">Time</span>
                <span id="timeValue" class="metric-value">—</span>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel results-panel">
        <div class="panel-header">
            <h2>Results</h2>
            <button onclick="exportResults()">Export JSON</button>
        </div>
        <div id="results" class="results-list">
            <div class="empty-state">Enter a query to search</div>
        </div>
    </div>
</div>

<!-- PROMPT PREVIEW MODAL -->
<dialog id="promptPreviewModal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">Full Prompt Preview</h3>
        <button onclick="closePromptPreview()">✕</button>
    </div>

    <div id="promptPreviewBody" style="margin-top:12px;"></div>

    <div style="margin-top:12px; text-align:right;">
        <button onclick="closePromptPreview()">Close</button>
    </div>
</dialog>

<script src="search.js"></script>
</body>
</html>
