<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Playground</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #13161e;
      --surface2: #1a1e29;
      --border: #252a38;
      --accent: #4fffb0;
      --accent2: #4f9fff;
      --accent3: #ff4f9f;
      --text: #e8eaf0;
      --text-dim: #6b7280;
      --text-muted: #3d4455;
      --radius: 10px;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(13, 15, 20, 0.9);
      backdrop-filter: blur(12px);
    }

    .logo { font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }

    .top-nav a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 11px;
      margin-right: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .top-nav a.active { color: var(--accent); }
    .top-nav a:hover { color: var(--text); }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(79,255,176,0.1);
      color: var(--accent);
      border: 1px solid rgba(79,255,176,0.2);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #llm-status {
      background: rgba(107,114,128,0.1);
      color: var(--text-dim);
      border-color: rgba(107,114,128,0.2);
    }

    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      height: calc(100vh - 57px);
    }

    .left-panel {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(13,15,20,0.6);
    }

    .left-panel::-webkit-scrollbar { width: 4px; }
    .left-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      width: 3px;
      height: 12px;
      background: var(--accent);
      border-radius: 2px;
    }

    .slider-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .slider-row:last-child { margin-bottom: 0; }

    .slider-label { display: flex; justify-content: space-between; align-items: center; color: var(--text-dim); font-size: 11px; }
    .slider-value { font-weight: 600; color: var(--accent); font-size: 12px; min-width: 32px; text-align: right; }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px;
      background: var(--border); border-radius: 2px; outline: none; cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(79,255,176,0.5);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 14px rgba(79,255,176,0.7);
    }

    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      padding: 10px 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--accent); }

    .prompt-actions { display: flex; gap: 8px; margin-top: 10px; }

    .btn {
      font-family: var(--font-mono);
      font-size: 11px; font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .btn-ghost { background: transparent; color: var(--text-dim); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); border-color: var(--text-dim); }

    .btn-outline { background: transparent; color: var(--accent2); border-color: rgba(79,159,255,0.3); }
    .btn-outline:hover { background: rgba(79,159,255,0.08); border-color: var(--accent2); }

    .btn-primary {
      background: var(--accent); color: #0d0f14;
      border-color: var(--accent); font-weight: 700;
      padding: 10px 24px; font-size: 12px;
      letter-spacing: 1px; text-transform: uppercase;
    }

    .btn-primary:hover:not(:disabled) {
      background: #7fffca;
      box-shadow: 0 0 20px rgba(79,255,176,0.4);
      transform: translateY(-1px);
    }

    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .right-panel { display: flex; flex-direction: column; overflow: hidden; }

    .question-area {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(13,15,20,0.4);
    }

    .question-label {
      font-family: var(--font-display);
      font-size: 10px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }

    .question-label::before { content: ''; width: 3px; height: 12px; background: var(--accent2); border-radius: 2px; }

    #question { min-height: 80px; max-height: 160px; }

    .question-footer { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 10px; }
    .char-count { color: var(--text-muted); font-size: 11px; }

    .response-area { flex: 1; overflow-y: auto; padding: 20px; }
    .response-area::-webkit-scrollbar { width: 4px; }
    .response-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text-muted); }
    .empty-icon { font-size: 36px; opacity: 0.4; }
    .empty-text { font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 1px; }

    .loading { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; height: 100%; color: var(--text-dim); }
    .loader { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 12px; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

    .result { display: none; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .meta-bar { display: flex; gap: 16px; margin-bottom: 16px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; flex-wrap: wrap; }
    .meta-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
    .meta-item strong { color: var(--accent); font-weight: 600; }
    .meta-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border); }

    .answer-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px; margin-bottom: 16px;
      line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 13px;
    }

    .citation {
      background: rgba(79,159,255,0.12);
      color: var(--accent2);
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 0.95em;
    }

    .context-header { font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .context-header::before { content: ''; width: 3px; height: 12px; background: var(--accent3); border-radius: 2px; }

    .context-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

    .context-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; transition: border-color 0.2s, transform 0.2s; }
    .context-card:hover { border-color: rgba(255,79,159,0.4); transform: translateY(-2px); }

    .context-card summary { cursor: pointer; list-style: none; }
    .context-card summary::-webkit-details-marker { display: none; }

    .card-num { font-size: 10px; font-weight: 700; color: var(--accent3); letter-spacing: 1px; text-transform: uppercase; margin-right: 8px; }
    .card-source { font-size: 11px; color: var(--accent2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-text { font-size: 11px; color: var(--text-dim); line-height: 1.5; margin-top: 8px; white-space: pre-wrap; }
    .card-score { margin-top: 8px; font-size: 10px; color: var(--text-muted); }
    .card-score span { color: var(--accent); font-weight: 600; }

    .error-block { display: none; background: rgba(255,79,79,0.05); border: 1px solid rgba(255,79,79,0.3); border-left: 3px solid #ff4f4f; border-radius: var(--radius); padding: 14px 16px; color: #ff9f9f; font-size: 12px; line-height: 1.6; animation: fadeIn 0.3s ease; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 700px; max-height: 80vh; display: flex; flex-direction: column; animation: fadeIn 0.2s ease; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; transition: color 0.15s; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-body pre { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex;align-items:center;gap:24px;">
      <div class="logo">RAG <span>Playground</span></div>
      <nav class="top-nav">
        <a href="/">Search Interface</a>
        <a href="/playground.html" class="active">LLM Playground</a>
      </nav>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span id="llm-status" class="badge">CHECKING</span>
      <span class="badge">ARIN 5360</span>
    </div>
  </header>

  <div class="layout">

    <div class="left-panel">
      <div class="section">
        <div class="section-title">Parameters</div>
        <div class="slider-row">
          <div class="slider-label">
            <span>Context Documents</span>
            <span class="slider-value" id="n-docs-val">3</span>
          </div>
          <input type="range" id="n-docs" min="1" max="10" step="1" value="3" />
        </div>
        <div class="slider-row">
          <div class="slider-label">
            <span>Temperature</span>
            <span class="slider-value" id="temp-val">0.7</span>
          </div>
          <input type="range" id="temperature" min="0.0" max="1.0" step="0.1" value="0.7" />
        </div>
      </div>

      <div class="section" style="flex:1;">
        <div class="section-title">System Prompt</div>
        <textarea id="system-prompt" rows="12" placeholder="Enter system prompt..."></textarea>
        <div class="prompt-actions">
          <button class="btn btn-ghost" id="reset-prompt">Reset</button>
          <button class="btn btn-outline" id="preview-prompt">Preview Full Prompt</button>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="question-area">
        <div class="question-label">Question</div>
        <textarea id="question" placeholder="Ask a question about your documents..."></textarea>
        <div class="question-footer">
          <span class="char-count" id="char-count">0 chars</span>
          <button class="btn btn-primary" id="generate-btn">Generate</button>
        </div>
      </div>

      <div class="response-area">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">◈</div>
          <div class="empty-text">Awaiting Query</div>
          <div style="font-size:11px;color:var(--text-muted);">Configure parameters and ask a question</div>
        </div>
        <div class="loading" id="loading">
          <div class="loader"></div>
          <div class="loading-text">Generating response...</div>
        </div>
        <div class="error-block" id="error-block"></div>
        <div class="result" id="result">
          <div class="meta-bar" id="meta-bar"></div>
          <div class="answer-block" id="answer-block"></div>
          <div class="context-header">Source Documents</div>
          <div class="context-grid" id="context-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Full Prompt Preview</div>
        <button class="modal-close" id="modal-close">X</button>
      </div>
      <div class="modal-body"><pre id="modal-content"></pre></div>
    </div>
  </div>

  <script>
    const DEFAULT_SYSTEM_PROMPT =
`You are a knowledgeable and helpful assistant that answers questions using only the context documents provided to you.

Guidelines:
1. Base your answer strictly on the provided context. Do not use outside knowledge.
2. When referencing information, cite the source document by name (e.g., "According to [source]..." or "As stated in [source]...").
3. If the context contains partial information, share what is available and clearly note what is missing or unclear.
4. If the context does not contain enough information to answer the question, say so honestly and directly — do not guess or fabricate an answer.
5. Keep your tone professional, clear, and concise.
6. If multiple sources agree or disagree, note that in your response.`;

    const systemPromptEl = document.getElementById('system-prompt');
    systemPromptEl.value = localStorage.getItem('rag_system_prompt') ?? DEFAULT_SYSTEM_PROMPT;
    systemPromptEl.addEventListener('input', () => localStorage.setItem('rag_system_prompt', systemPromptEl.value));

    const nDocsSlider = document.getElementById('n-docs');
    const tempSlider  = document.getElementById('temperature');

    nDocsSlider.addEventListener('input', () => document.getElementById('n-docs-val').textContent = nDocsSlider.value);
    tempSlider.addEventListener('input',  () => document.getElementById('temp-val').textContent  = parseFloat(tempSlider.value).toFixed(1));

    document.getElementById('reset-prompt').addEventListener('click', () => {
      systemPromptEl.value = DEFAULT_SYSTEM_PROMPT;
      localStorage.setItem('rag_system_prompt', DEFAULT_SYSTEM_PROMPT);
    });

    const questionEl = document.getElementById('question');
    questionEl.addEventListener('input', () => document.getElementById('char-count').textContent = questionEl.value.length + ' chars');
    questionEl.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generate(); });

    function highlightCitations(text) {
      return String(text || '').replace(/\[(.*?)\]/g, '<span class="citation">[$1]</span>');
    }

    async function checkHealth() {
      const badge = document.getElementById('llm-status');
      try {
        const d = await (await fetch('/health')).json();
        if (d.rag_available) {
          badge.textContent = 'LLM READY';
          badge.style.cssText = 'background:rgba(79,255,176,0.1);color:var(--accent);border-color:rgba(79,255,176,0.2);';
        } else {
          badge.textContent = 'LLM OFFLINE';
          badge.style.cssText = 'background:rgba(255,79,79,0.1);color:#ff9f9f;border-color:rgba(255,79,79,0.2);';
        }
      } catch {
        badge.textContent = 'API DOWN';
        badge.style.cssText = 'background:rgba(255,79,79,0.1);color:#ff9f9f;border-color:rgba(255,79,79,0.2);';
      }
    }
    checkHealth();

    document.getElementById('generate-btn').addEventListener('click', generate);

    async function generate() {
      const question = questionEl.value.trim();
      if (!question) { showError('Please enter a question.'); return; }

      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      setView('loading');

      const t0 = Date.now();

      try {
        const res = await fetch('/rag', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question,
            n_context_docs: parseInt(nDocsSlider.value),
            temperature: parseFloat(tempSlider.value),
            system_prompt: systemPromptEl.value
          }),
        });

        const elapsed = ((Date.now() - t0) / 1000).toFixed(2);

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          showError('Error ' + res.status + ': ' + (err.detail || 'Request failed'));
          return;
        }

        renderResult(await res.json(), elapsed);

      } catch {
        showError('Network error: Could not reach the API. Is the server running?');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate';
      }
    }

    function renderResult(data, elapsed) {
      const words = String(data.answer || '').trim().split(/\s+/).filter(Boolean).length;

      document.getElementById('meta-bar').innerHTML =
        '<div class="meta-item">Time: <strong>' + elapsed + 's</strong></div>' +
        '<div class="meta-dot"></div>' +
        '<div class="meta-item">Docs used: <strong>' + (data.context_count ?? 0) + '</strong></div>' +
        '<div class="meta-dot"></div>' +
        '<div class="meta-item">Words: <strong>' + words + '</strong></div>' +
        '<div class="meta-dot"></div>' +
        '<div class="meta-item">Temp: <strong>' + parseFloat(tempSlider.value).toFixed(1) + '</strong></div>';

      document.getElementById('answer-block').innerHTML = highlightCitations(data.answer);

      const grid = document.getElementById('context-grid');
      grid.innerHTML = '';
      (data.context || []).forEach((doc, i) => {
        const source = (doc.metadata && (doc.metadata.source || doc.metadata.filename)) || ('Document ' + (i + 1));
        const score  = doc.score != null ? parseFloat(doc.score).toFixed(3) : null;

        const card = document.createElement('details');
        card.className = 'context-card';

        card.innerHTML =
          '<summary>' +
            '<span class="card-num">Source ' + (i + 1) + '</span>' +
            '<span class="card-source" title="' + source + '">' + source + '</span>' +
          '</summary>' +
          '<div class="card-text">' + (doc.text || '') + '</div>' +
          (score !== null ? '<div class="card-score">Relevance: <span>' + score + '</span></div>' : '');

        grid.appendChild(card);
      });

      setView('result');
    }

    function showError(msg) {
      const el = document.getElementById('error-block');
      el.textContent = msg;
      el.style.display = 'block';
      setView('error');
    }

    function setView(s) {
      document.getElementById('empty-state').style.display = s === 'empty'   ? 'flex'  : 'none';
      document.getElementById('loading').style.display     = s === 'loading'  ? 'flex'  : 'none';
      document.getElementById('error-block').style.display = s === 'error'    ? 'block' : 'none';
      document.getElementById('result').style.display      = s === 'result'   ? 'block' : 'none';
    }

    document.getElementById('preview-prompt').addEventListener('click', () => {
      const q   = questionEl.value.trim() || '<your question here>';
      const ctx = '[1] Source: example.txt\nRetrieved document content appears here...\n\n[2] Source: another.txt\nAdditional context from indexed documents...';
      document.getElementById('modal-content').textContent =
        '=== SYSTEM PROMPT ===\n' + systemPromptEl.value +
        '\n\n=== USER PROMPT ===\nContext information from relevant documents:\n\n' + ctx +
        '\n\nBased on the context above, please answer the following question.\nIf the context doesn\'t contain enough information, say so.\n\nQuestion: ' + q + '\n\nAnswer:';
      document.getElementById('modal-overlay').classList.add('open');
    });

    document.getElementById('modal-close').addEventListener('click', () => document.getElementById('modal-overlay').classList.remove('open'));
    document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === document.getElementById('modal-overlay')) document.getElementById('modal-overlay').classList.remove('open'); });
  </script>
</body>
</html>
